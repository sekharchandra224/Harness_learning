pipeline:
  name: Testing_pipeline
  identifier: Testing_pipeline
  projectIdentifier: My_First_CI
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: Harness
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build Stage
        identifier: build_stage
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Maven Build
                  identifier: Maven_Build
                  spec:
                    shell: Sh
                    command: mvn clean install
